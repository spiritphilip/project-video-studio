name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VIDEO_STUDIO_SKIP_LIBRARY: "1"
      VIDEO_STUDIO_HOME: ${{ runner.temp }}/video-studio-home
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check every script
        run: |
          for f in scripts/*.mjs template/scripts/*.mjs; do node --check "$f"; done

      - name: Validate JSON
        run: |
          for f in setup/*.json template/*.json template/scripts/videos/*.json template/youtube/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || exit 1; done

      - name: Scaffold a demo project
        run: node scripts/scaffold.mjs --project "$RUNNER_TEMP/demo"

      - name: Install and type-check the kit
        working-directory: ${{ runner.temp }}/demo/videos
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
